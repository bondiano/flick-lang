[package]
name = "flick-syntax"
description = "The lexer and layout-aware parser of Flick: a lossless concrete tree and its AST view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
flick-diagnostics = { path = "../flick-diagnostics" }
flick-ir = { path = "../flick-ir" }
flick-plugin = { path = "../flick-plugin" }
fln-literals = { workspace = true }

[dev-dependencies]
fln = { workspace = true }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = { workspace = true }

[[bench]]
name = "parse"
harness = false
