[package]
name = "flick"
description = "CLI for the Flick language"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# loads plugins built as WebAssembly components; release builds enable it
wasm-plugins = ["wasm-backends"]
wasm-backends = ["dep:wasmtime", "flick-backend/host"]

[dependencies]
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "string"] }
ciborium = "0.2.2"
flate2 = "1.1.1"
flick-core = { path = "../flick-core", features = ["ide"] }
flick-backend = { path = "../flick-backend" }
flick-ir = { path = "../flick-ir", features = ["json", "cbor"] }
flick-plugin = { path = "../flick-plugin" }
wasmtime = { workspace = true, optional = true }
serde_json = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10.9"
signal-hook = "0.4.6"
tar = "0.4.44"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
ureq = "2.12.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "termios"] }

[dev-dependencies]
flick-test-support = { path = "../flick-test-support" }
flick-model = { path = "../flick-model" }
flick-wasm = { path = "../flick-wasm" }
insta = "1.49.0"
wat = "=1.254.2"
