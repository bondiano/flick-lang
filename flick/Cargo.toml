[package]
name = "flick"
description = "CLI for the Flick language"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anstyle = "1.0.14"
clap = { version = "4.6.7", features = ["derive", "string"] }
flick-core = { path = "../flick-core", features = ["ide"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "termios"] }

[dev-dependencies]
flick-model = { path = "../flick-model" }
flick-wasm = { path = "../flick-wasm" }
insta = "1.49.0"
serde_json = "1.0.154"
