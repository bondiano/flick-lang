id = "flick"
name = "Flick"
version = "0.2.0"
schema_version = 1
authors = ["bondiano"]
description = "Flick language support"
repository = "https://github.com/bondiano/flick-lang"

# Zed clones the grammar at `rev`: point it at a commit that contains
# editors/tree-sitter-flick, or at `file:///…/flick-lang` while developing.
[grammars.flick]
repository = "https://github.com/bondiano/flick-lang"
rev = "b7ba4bfef561796c8ec86edec1e8270ad9ac395a"
path = "editors/tree-sitter-flick"

[language_servers.flick]
name = "Flick"
languages = ["Flick"]
