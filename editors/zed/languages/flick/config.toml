name = "Flick"
grammar = "flick"
path_suffixes = ["fl"]
line_comments = ["// ", "/// "]
block_comment = ["/* ", " */"]
# a tab is a syntax error: layout is indented with spaces
tab_size = 2
hard_tabs = false
brackets = [
  { start = "(", end = ")", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "{", end = "}", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
