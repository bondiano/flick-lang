# Each entrypoint of the pinned `effect` package: its modules are classified
# export by export under `modules`, or it is excluded as a whole.

"effect" = { modules = "core" }
"effect/ai" = { excluded = "AI provider clients are outside the 0.1.0 standard library" }
"effect/cli" = { modules = "cli" }
"effect/cluster" = { excluded = "distributed entities and sharding are outside 0.1.0" }
"effect/devtools" = { modules = "devtools" }
"effect/encoding" = { excluded = "byte encodings are outside the 0.1.0 standard library" }
"effect/eventlog" = { excluded = "event-sourcing infrastructure is outside 0.1.0" }
"effect/graphql" = { excluded = "GraphQL is outside the 0.1.0 standard library" }
"effect/http" = { modules = "http" }
"effect/http-api" = { modules = "http-api" }
"effect/net" = { excluded = "sockets and networking below HTTP are outside 0.1.0" }
"effect/observability" = { modules = "observability" }
"effect/persistence" = { excluded = "persistence backends are outside 0.1.0" }
"effect/process" = { modules = "process" }
"effect/reactivity" = { modules = "reactivity" }
"effect/rpc" = { modules = "rpc" }
"effect/schema" = { excluded = "Flick's Schema and codecs cover schemas; this entrypoint's extras are outside 0.1.0" }
"effect/socket" = { excluded = "sockets are outside the 0.1.0 standard library" }
"effect/sql" = { excluded = "Flick's SQL eDSL has its own PostgreSQL driver" }
"effect/testing" = { excluded = "Flick tests run through `flick test` and the Test module; `Test.clock_test` provides a TestClock and `Test.adjust`/`Test.set_time` move it" }
"effect/workers" = { excluded = "the worker platforms come from `@effect/platform-node` and `@effect/platform-browser` inside `Rpc.worker` and `Rpc.node_worker`; workers outside RPC are outside 0.1.0" }
"effect/workflow" = { excluded = "durable workflows are outside 0.1.0" }
