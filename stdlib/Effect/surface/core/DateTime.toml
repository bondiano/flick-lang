getPart = "record field access: `(DateTime.to_parts t).hour`"
getPartUtc = "record field access: `(DateTime.to_parts_utc t).hour`"
withCurrentZone = "provide: `provide (DateTime.layer_current_zone zone) { … }`"
withCurrentZoneLocal = "provide: `provide DateTime.layer_current_zone_local { … }`"
withCurrentZoneOffset = "provide: `provide (DateTime.layer_current_zone_offset offset) { … }`"
withCurrentZoneNamed = "provide: `DateTime.layer_current_zone_named id`, then `provide layer { … }`"

[excluded]
isDateTime = "TS-only: a type guard over `unknown`; Flick values are typed statically"
isTimeZone = "TS-only: a type guard over `unknown`; Flick values are typed statically"
isTimeZoneOffset = "TS-only: a type guard over `unknown`; `DateTime.zone_to_string` tells the zones apart"
isTimeZoneNamed = "TS-only: a type guard over `unknown`; `DateTime.zone_to_string` tells the zones apart"
makeUnsafe = "invariant: unsafe: throws on an invalid input; `DateTime.make` is checked"
makeZonedUnsafe = "invariant: unsafe: throws on an invalid input or zone; `DateTime.make_zoned` is checked"
fromDateUnsafe = "invariant: unsafe: throws on an invalid `Date`, and a JS `Date` is mutable state outside `Ref`"
zoneMakeNamedUnsafe = "invariant: unsafe: throws on an unknown zone; `DateTime.zone_make_named` is checked"
setZoneNamedUnsafe = "invariant: unsafe: throws on an unknown zone; `DateTime.set_zone_named` is checked"
nowUnsafe = "invariant: unsafe: reads the clock outside a runtime call; `DateTime.now` is one"
isFutureUnsafe = "invariant: unsafe: reads the clock outside a runtime call; `DateTime.is_future` is one"
isPastUnsafe = "invariant: unsafe: reads the clock outside a runtime call; `DateTime.is_past` is one"
nowAsDate = "invariant: a JS `Date` is shared mutable state outside `Ref`; `DateTime.now` gives the instant"
toDate = "invariant: a JS `Date` is shared mutable state outside `Ref`; `DateTime.to_parts` gives its fields"
toDateUtc = "invariant: a JS `Date` is shared mutable state outside `Ref`; `DateTime.to_parts_utc` gives its fields"
withDate = "invariant: hands a mutable JS `Date` to the callback, shared state outside `Ref`"
withDateUtc = "invariant: hands a mutable JS `Date` to the callback, shared state outside `Ref`"
mutate = "invariant: mutates a JS `Date` in place, shared state outside `Ref`; `DateTime.set_parts` and `DateTime.add` cover its uses"
mutateUtc = "invariant: mutates a JS `Date` in place, shared state outside `Ref`; `DateTime.set_parts_utc` covers its uses"
