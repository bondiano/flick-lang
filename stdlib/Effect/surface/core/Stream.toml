[language]
Do = "records and `Stream.flat_map`: a record literal names its fields statically"
bind = "records and `Stream.flat_map`: a record literal names its fields statically"
bindEffect = "records and `Stream.map_effect`: a record literal names its fields statically"
bindTo = "records and `Stream.map`: a record literal names its fields statically"
catchReason = "`Stream.catch` with a `match` on the error and its data"
catchReasons = "`Stream.catch` with a `match` on the error and its data"
catchTag = "`Stream.catch` with a `match` on the error, `Stream.fail` for the others"
catchTags = "`Stream.catch` with a `match` on the error, `Stream.fail` for the others"
let = "records and `Stream.map`: a record literal names its fields statically"
provideContext = "`provide` / `Stream.provide_`: a layer provides services; Flick has no context values"
scoped = "`scope { … }` around the run: what the stream acquires belongs to that scope and is released when it closes"
service = "`service`: a stream step calls the operations of a service in its row (`Stream.map_effect (fun x -> S.op x)`)"
serviceOption = "`service` rows: whether a service is there is known statically, so a stream asks for it in its row"
sync = "`Stream.from_effect (task { … })`: the body runs each time the stream runs"
tapErrorTag = "`Stream.tap_error` with a `match` on the error"
unwrapReason = "`Stream.map_error` with a `match` on the error and its data"
updateContext = "`Stream.provide_` and `Stream.update_service`: services are changed by layers and by name, not as a context value"

[excluded]
Error = "TS-only: extracts a type parameter of a stream type"
EventListener = "TS-only: the structural type of an event target; Flick passes the target as a `JsValue`"
Services = "TS-only: extracts a type parameter of a stream type"
StreamTypeLambda = "TS-only: a type lambda for higher-kinded TS signatures"
StreamUnify = "TS-only: type unification machinery"
StreamUnifyIgnore = "TS-only: type unification machinery"
Success = "TS-only: extracts a type parameter of a stream type"
TypeId = "TS-only: a type identifier"
Variance = "TS-only: variance markers of the type parameters"
VarianceStruct = "TS-only: variance markers of the type parameters"
combine = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
combineArray = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
flattenTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover (see `Take.Take`); typed failures carry only errors"
fromIteratorSucceed = "invariant: a JS iterator is mutable state the stream consumes outside `Ref`; `Stream.from_list`, `iterate` and `unfold` build the elements"
fromPubSubTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover (see `Take.Take`); typed failures carry only errors"
fromPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
isStream = "TS-only: a type guard; Flick values are typed statically"
toAsyncIterable = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
toAsyncIterableEffect = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
toAsyncIterableWith = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
toPubSubTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover (see `Take.Take`); typed failures carry only errors"
toPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
toReadableStream = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
toReadableStreamEffect = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
toReadableStreamWith = "invariant: the JS consumer runs the stream outside the entry runner, with no owner that waits for it"
transformPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
transformPullBracket = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
