[excluded]
FunctionN = "TS-only: a variadic TS function type"
FunctionTypeLambda = "TS-only: a type lambda for TS higher-kinded encodings"
dual = "TS-only: builds data-first and data-last TS APIs; Flick functions take the subject last"
satisfies = "TS-only: checks a TS type without changing it"
hole = "TS-only: a typed placeholder for unfinished TS code, which throws"
constNull = "TS-only: Flick has no `null`"
cast = "invariant: an unchecked cast would erase types, and with them captures and regions"
memoize = "invariant: a hidden cache is shared mutable state outside `Ref`"
memoizeIdempotent = "invariant: a hidden cache is shared mutable state outside `Ref`"
