toFormatter = "`deriving Show`"
toTaggedUnion = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
withConstructorDefault = "record literals and constructors give every field; a default is a function of the program"

