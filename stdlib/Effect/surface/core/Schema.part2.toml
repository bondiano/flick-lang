TaggedStruct = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
TaggedUnion = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
Tuple = "`deriving Schema` of a tuple type"
TupleWithRest = "a tuple type has a fixed arity; `Codec.non_empty_list` and `Codec.list` cover a head with a rest"
Union = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
overrideToEquivalence = "an `Eq` instance of the type"
overrideToFormatter = "a `Show` instance of the type"
refine = "`refined type T = U where \u2026`: a nominal type with a checked predicate and `T.parse`"
suspend = "`deriving Schema`: a reference to a type of the same module is lazy, so recursive types work"
tag = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
tagDefaultOmit = "`deriving Schema` of a variant type: constructors are `{\"_tag\": \"Name\", \"_0\": \u2026}`"
