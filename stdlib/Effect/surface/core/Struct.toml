# Flick records are exact plain objects with the fields of their type.
[wrapped]
keys = "Record.labels 59a472c41aac0334"
pick = "Record.project 0c8a737842e9bc05"
omit = "Record.project 020f178bdcdf0adf"
Record = "Record.from_keys 7d29b11beef137d7"

[language]
get = "field access `r.field`"
assign = "a record literal, or `{ r with field = … }` for the fields replaced"
evolve = "`{ r with field = f r.field }`"
evolveKeys = "a record literal with the fields renamed: `{ new = r.old }`"
evolveEntries = "a record literal with the fields renamed and mapped"
renameKeys = "a record literal with the fields renamed: `{ new = r.old }`"
map = "a record literal applying the function to each field"
mapPick = "`{ r with field = f r.field }` for the fields picked"
mapOmit = "`{ r with field = f r.field }` for the other fields"
makeEquivalence = "the class `Eq`: records compare field by field"
makeOrder = "the class `Ord`: records compare field by field in label order"

[excluded]
Simplify = "TS-only: a type-level helper"
Mutable = "TS-only: a type-level helper; Flick records are immutable"
Assign = "TS-only: a type-level helper"
Lambda = "TS-only: the type-level lambda of `Struct.map`"
Apply = "TS-only: applies a type-level lambda"
lambda = "TS-only: fixes the TS type of a type-level lambda"

[pending]
makeCombiner = "M20"
