[wrapped]
Equivalence = "Equivalence.Equivalence 9bfc121ce6325fae"
make = "Equivalence.make a8e131073508c38f"
combine = "Equivalence.combine b27c43ce4f22208e"
combineAll = "Equivalence.combine_all ef9ccfdd863bee13"
mapInput = "Equivalence.map_input 3ddc4fcc2edbcde7"
Tuple = "Equivalence.tuple 9d05b2c258f107cc"
Array = "Equivalence.list e1f35a7633d48738"
makeReducer = "Equivalence.make_reducer ac23f05e0a5d355f"

[language]
String = "class `Eq`: `==` on `String`"
Number = "class `Eq`: `==` on `Number`"
Boolean = "class `Eq`: `==` on `Bool`"
BigInt = "class `Eq`: `==` on `BigInt`"
Struct = "a record's `Eq` instance; per-field equivalences through `Equivalence.map_input` joined by `Equivalence.combine`"

[excluded]
EquivalenceTypeLambda = "TS-only: the type lambda of the HKT encoding; Flick has kinds"
Date = "invariant: a JS `Date` is mutable shared state outside `Ref`; Flick has no type for it"
Record = "TS-only: an equivalence of string-keyed JS dictionary objects; Flick has no such type (records have fixed fields, maps are `HashMap`)"
strictEqual = "invariant: `===` on any value observes object identity, which Flick values do not have; `Number.strict_equal` is `===` on numbers"
