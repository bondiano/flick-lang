[language]
Do = "nested `List.flat_map` building record literals: Flick has no do notation"
bind = "nested `List.flat_map` building record literals: Flick has no do notation"
bindTo = "`List.map` to a record literal: Flick has no do notation"
let = "`List.map` to a record literal with the extra field: Flick has no do notation"
makeEquivalence = "the class `Eq`: the instance `Eq (List a)` compares element by element"
makeOrder = "the class `Ord`: the instance `Ord (List a)` compares lexicographically"
fromNullishOr = "`nullable`/`optional i` on a foreign binding: JS `null`/`undefined` cross as `Option`, then `Option.to_list`"
liftNullishOr = "`nullable` on a foreign binding gives `Option`, then `List.lift_option`"
flatMapNullishOr = "`nullable` on a foreign binding gives `Option`, then `List.filter_map`"

[excluded]
ReadonlyArrayTypeLambda = "TS-only: a type lambda for TS higher-kinded encodings"
isArray = "TS-only: a type guard; Flick values are typed statically"
ensure = "TS-only: takes a value or an array of them, a union Flick types never have"
fromIterable = "TS-only: Flick has no `Iterable` interface; each collection has its `to_list`"
allocate = "invariant: an array of holes filled by mutation; Flick lists are immutable and hold no `undefined` (mutable arrays are `Js.Array`)"
copy = "invariant: a copy exists only to be mutated; Flick lists are immutable and shared as they are (mutable arrays are `Js.Array`)"
getUnsafe = "invariant: `unsafe*` throws a defect for a missing element instead of a typed `Option` (`List.get`)"

