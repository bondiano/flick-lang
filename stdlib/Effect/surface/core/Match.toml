[language]
type = "`match … with`: a match is an expression over a typed value, not a matcher built in steps"
value = "`match value with`"
fn = "a function whose body is a `match` on its argument"
when = "a `match` arm with a pattern, or a `when` guard"
whenOr = "a `match` arm with an or-pattern `p1 | p2`"
whenAnd = "a `match` arm with a pattern and a `when` guard"
not = "a `match` arm after the arms of the excluded patterns, or a `when not …` guard"
tag = "a `match` arm on a constructor"
tags = "`match` arms on constructors"
tagsExhaustive = "`match` arms on constructors; the checker requires them to cover every value"
tagStartsWith = "a `match` arm with a `when String.starts_with …` guard"
discriminator = "a `match` arm on a constructor: Flick ADTs carry no user discriminator field"
discriminators = "`match` arms on constructors"
discriminatorsExhaustive = "`match` arms on constructors; the checker requires them to cover every value"
discriminatorStartsWith = "a `match` arm with a `when String.starts_with …` guard"
valueTags = "`match value with` and arms on constructors"
typeTags = "a function whose body is a `match` with arms on constructors"
exhaustive = "`match`: the checker requires the arms to cover every value (`FLICK-T009`)"
orElse = "a last `match` arm `| _ -> …`"
orElseAbsurd = "`match`: an arm that cannot be reached is the warning `FLICK-T010`"
option = "a `match` whose arms return `Some …` and a last arm `| _ -> None`"
result = "a `match` whose arms return `Ok …` and a last arm `| other -> Err other`"
is = "literal patterns in `match` arms"
nonEmptyString = "a `match` arm with a `when s != ''` guard"
any = "a `_` pattern"
defined = "Flick has no `undefined`: an absent value is `None`, matched by `Some x`"

[excluded]
Case = "TS-only: the type of a matcher's cases"
Matcher = "TS-only: the type of a matcher built in steps"
TypeMatcher = "TS-only: the type of a matcher built in steps"
ValueMatcher = "TS-only: the type of a matcher built in steps"
Not = "TS-only: the type of a matcher's cases"
When = "TS-only: the type of a matcher's cases"
SafeRefinement = "TS-only: a TS refinement of a pattern"
Types = "TS-only: the type-level machinery of matchers"
ValueFlavor = "TS-only: a type-level flag of matchers"
withReturnType = "TS-only: fixes a TS type parameter; a `match` has the type of its arms"
bigint = "TS-only: a type guard over `unknown`; Flick values are typed statically"
boolean = "TS-only: a type guard over `unknown`; Flick values are typed statically"
date = "TS-only: a type guard over `unknown`; Flick values are typed statically"
null = "TS-only: a type guard over `unknown`; Flick values are typed statically"
number = "TS-only: a type guard over `unknown`; Flick values are typed statically"
record = "TS-only: a type guard over `unknown`; Flick values are typed statically"
string = "TS-only: a type guard over `unknown`; Flick values are typed statically"
symbol = "TS-only: a type guard over `unknown`; Flick values are typed statically"
undefined = "TS-only: a type guard over `unknown`; Flick values are typed statically"
instanceOf = "TS-only: a type guard over `unknown`; Flick values are typed statically"
instanceOfUnsafe = "invariant: `unsafe*`: a refinement the type does not prove"
