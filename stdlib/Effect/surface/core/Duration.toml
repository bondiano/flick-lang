[excluded]
isDuration = "TS-only: a type guard over `unknown`; Flick values are typed statically"
DurationObject = "TS-only: an input shape of `fromInput`; Flick builds durations with the checked unit constructors"
DurationValue = "TS-only: the representation inside a duration; `Duration.match_` reads it"
Unit = "TS-only: the unit names of the string input; `Duration.from_input` parses them"
fromInputUnsafe = "invariant: unsafe: throws on an invalid input; `Duration.from_input` is checked"
divideUnsafe = "invariant: unsafe: throws on a zero divisor; `Duration.divide` is checked"
toNanosUnsafe = "invariant: unsafe: throws for an infinite duration; `Duration.to_nanos` is an `Option`"
negate = "invariant: Flick durations are never negative (checked constructors); a negation would make one"
negativeInfinity = "invariant: Flick durations are never negative (checked constructors)"
isNegative = "invariant: Flick durations are never negative (checked constructors), so it would always be false"
abs = "invariant: Flick durations are never negative (checked constructors), so it would be the identity"
