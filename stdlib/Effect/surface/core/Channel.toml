[language]
Do = "`Channel.map` to a record literal, `Channel.flat_map` for a field from another channel: Flick has no do notation"
bind = "`Channel.flat_map` building a record literal: Flick has no do notation"
bindTo = "`Channel.map` to a record literal: Flick has no do notation"
let = "`Channel.map` to a record literal with the extra field: Flick has no do notation"
catchTag = "`Channel.catch` with a `match` on the error, failing again with `Channel.fail` for the other errors"
catchIf = "`Channel.catch` with a `match` and a guard, failing again with `Channel.fail` for the other errors"
catchFilter = "`Channel.catch` with a `match` on the error, failing again with `Channel.fail` for the other errors"
catchReason = "`Channel.catch` with a `match` on the error and its reason field, failing again with `Channel.fail` for the rest"
catchReasons = "`Channel.catch` with a `match` on the error and its reason field, failing again with `Channel.fail` for the rest"
unwrapReason = "`Channel.map_error` with a `match` that picks the reason of the error"
catchCauseIf = "`Channel.catch_cause` with a `match` on `Failure.primary`, failing again with `Channel.fail_cause` for the rest"
catchCauseFilter = "`Channel.catch_cause` with a `match` on `Failure.primary`, failing again with `Channel.fail_cause` for the rest"
provideContext = "`provide` with a layer (`Channel.provide_`): a Flick program holds services through layers, never a `Context` value"
contextWith = "a service operation: a Flick program reaches a service through its operations, never a `Context` value"
updateContext = "`provide` with a layer (`Channel.provide_`) or `Channel.update_service`: a Flick program never holds a `Context` value"

[excluded]
TypeId = "TS-only: a type identifier"
isChannel = "TS-only: a type guard; Flick values are typed statically"
Variance = "TS-only: the variance of the TS type parameters"
VarianceStruct = "TS-only: the variance of the TS type parameters"
ChannelUnify = "TS-only: union unification of TS types"
ChannelUnifyIgnore = "TS-only: union unification of TS types"
scoped = "TS-only: removes Effect's `Scope` from the requirements; a Flick channel never requires one"
fromIterator = "TS-only: Flick has no `Iterator`; a list is read with `Channel.from_list`"
fromIteratorArray = "TS-only: Flick has no `Iterator`; a list is read with `Channel.from_list_chunked`"
fromTransform = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
transformPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
fromPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
fromTransformBracket = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
toTransform = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
toPull = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
toPullScoped = "invariant: a pull ends through the error channel (`Cause.Done` with its leftover); typed failures carry only errors"
combine = "invariant: the step function reads both sides through pulls that end through the error channel (`Cause.Done`); typed failures carry only errors"
embedInput = "invariant: the input is fed from a pull that ends through the error channel (`Cause.Done`); typed failures carry only errors"
fromEffectTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover, control flow through the error channel; typed failures carry only errors"
flattenTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover, control flow through the error channel; typed failures carry only errors"
fromPubSubTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover, control flow through the error channel; typed failures carry only errors"
toPubSubTake = "invariant: a take ends a stream with the `Exit` of a `Cause.Done` leftover, control flow through the error channel; typed failures carry only errors"
die = "invariant: Flick code raises no defects; a channel fails with a typed error (`Channel.fail`) or a whole `Failure` (`Channel.fail_cause`)"
orDie = "invariant: Flick code raises no defects; a typed error stays in the error row"
catchDefect = "invariant: a defect is not recovered as a value next to typed errors; it reaches a handler only inside a `Failure` (`Channel.catch_cause`)"
