let = "a runtime function body: `let` bindings of direct calls"
gen = "a runtime function: its body is direct calls"
fn = "a runtime function, with `Tracer.with_span` for its span"
fnUntraced = "a runtime function: its body is direct calls"
fnUntracedEager = "a runtime function: its body is direct calls"
flatMap = "a runtime function body: direct calls run one after another"
flatMapEager = "a runtime function body: direct calls run one after another"
andThen = "a runtime function body: direct calls run one after another"
map = "a runtime function body: direct calls run one after another"
mapEager = "a runtime function body: direct calls run one after another"
as = "a runtime function body: direct calls run one after another"
asVoid = "a runtime function body: direct calls run one after another"
tap = "a runtime function body: direct calls run one after another"
asSome = "`Some` of a direct call"
flatten = "`await` of the task a task gives"
succeed = "`task { … }`: builds the task from its body without running it"
sync = "`task { … }`: builds the task from its body without running it"
suspend = "`task { … }`: builds the task from its body without running it"
undefined = "`task { … }`: builds the task from its body without running it"
succeedNone = "`task { … }`: builds the task from its body without running it"
succeedSome = "`task { … }`: builds the task from its body without running it"
fail = "`from_result (Err error)`"
failSync = "`from_result (Err error)`"
catch = "`try … with`: an arm for every error"
catchEager = "`try … with`: an arm for every error"
catchTag = "`try … with`: an arm per constructor"
catchTags = "`try … with`: an arm per constructor"
catchIf = "`try … with`: an arm with a `when` guard"
catchFilter = "`try … with`: an arm with a pattern and a `when` guard"
catchReason = "`try … with`: a nested pattern on the error's reason"
catchReasons = "`try … with`: nested patterns on the error's reasons"
unwrapReason = "`try … with`: an arm that fails with the error's reason (`from_result (Err reason)`)"
catchNoSuchElement = "`try … with`: `| Cause.NoSuchElementError _ -> None`"
mapError = "`try … with`: an arm that fails with the new error"
mapErrorEager = "`try … with`: an arm that fails with the new error"
mapBoth = "`try … with` around a direct call, mapping the value and failing with the new error"
mapBothEager = "`try … with` around a direct call, mapping the value and failing with the new error"
orElseSucceed = "`try … with`: an arm that gives the value"
tapError = "`try … with`: an arm that runs the call and fails again with the error"
tapErrorTag = "`try … with`: an arm per constructor that runs the call and fails again"
match = "`try … with` around `on_success` of the direct call"
matchEager = "`try … with` around `on_success` of the direct call"
matchEffect = "`try … with` around `on_success` of the direct call"
result = "`try … with`: `try Ok (await t) with e -> Err e`"
option = "`try … with`: `try Some (await t) with _ -> None`"
isSuccess = "`try … with`: `try (await t; true) with _ -> false`"
isFailure = "`try … with`: `try (await t; false) with _ -> true`"
flip = "`try … with` and `from_result (Err value)`: the error as the value and back"
fromOption = "`match` on the `Option`, failing with `from_result (Err error)`"
transposeOption = "`match` on the `Option` of a task, `await` in the `Some` arm"
fromNullishOr = "`nullable` on a foreign binding gives an `Option`"
promise = "`foreign async`: the promise of a foreign function"
tryPromise = "`foreign async … catch`: a rejection becomes the typed error"
try = "`foreign sync … catch`: a throw becomes the typed error"
callback = "`foreign async`: a callback API is bound as a promise-returning function"
effectify = "`foreign async`: a callback API is bound as a promise-returning function"
abortSignal = "`foreign async … cancel signal`: the signal aborts on interruption"
provide = "`provide layer { … }`"
provideService = "`provide (Layer.succeed S impl) { … }`"
provideServiceEffect = "`provide` of a layer that builds the service"
updateService = "`provide (Layer.succeed S impl) { … }` with operations that call the outer service"
updateServiceScoped = "`provide (Layer.succeed S impl) { … }` around the rest of the scope"
service = "`service`: an operation `S.op` looks its service up"
scope = "`scope s { … }` names the owner `s` of its region"
scoped = "`scope { … }`"
scopedWith = "`scope s { … }`"
acquireDisposable = "`Resource.acquire_release` with the foreign dispose call as the release"
whileLoop = "a recursive runtime function, or `Loop.loop` for pure state"
forkIn = "`Fiber.spawn owner supervisor task`: a child of a scope's owner"
forkScoped = "`Fiber.spawn owner supervisor task`: a child of a scope's owner"

