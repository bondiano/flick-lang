fromArrayUnsafe = "invariant: `unsafe*` shares a mutable array without a copy (`Chunk.from_list` copies)"
fromNonEmptyArrayUnsafe = "invariant: `unsafe*` shares a mutable array without a copy (`Chunk.make` copies)"
getUnsafe = "invariant: `unsafe*` throws a defect for a missing element instead of a typed `Option` (`Chunk.get`)"
headUnsafe = "invariant: `unsafe*` throws a defect for an empty chunk instead of a typed `Option` (`Chunk.head`)"
lastUnsafe = "invariant: `unsafe*` throws a defect for an empty chunk instead of a typed `Option` (`Chunk.last`)"
