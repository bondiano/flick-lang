name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # installs the toolchain, components and targets from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: |
          rustup target add wasm32-wasip2
          just zed
          CARGO_TARGET_DIR=target/zed cargo test --manifest-path editors/zed/Cargo.toml --locked
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: just check
      - run: just effect-coverage >> "$GITHUB_STEP_SUMMARY"
      - run: just e2e
      - run: just bundle-size >> "$GITHUB_STEP_SUMMARY"
      - run: just e2e-postgres
