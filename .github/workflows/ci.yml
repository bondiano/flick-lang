name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# a newer push to a pull request replaces the run of the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # a pull request loosens no budget without a reason (`just ratchet`)
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          node --test tools/perf/*.test.mjs tools/load/*.test.mjs
          node tools/perf/ratchet.mjs FETCH_HEAD
      # installs the toolchain, components and targets from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-machete@0.9.2
      - run: |
          rustup target add wasm32-wasip2
          just zed
          CARGO_TARGET_DIR=target/zed cargo test --manifest-path editors/zed/Cargo.toml --locked
      - run: just lint

  # the root setup Action, as a user meets it: its installer resolves the
  # compiler release, so it is tested where every pull request sees it, not
  # only where a release is cut. It needs no Rust toolchain of its own
  actions:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: node --test .github/actions/setup-flick/install.test.mjs

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      # some tests run pnpm; its version comes from `packageManager`
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: just unit
      - run: just effect-coverage >> "$GITHUB_STEP_SUMMARY"

  features:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - run: just feature-test

  # the JS packages, the playground's compiler, the Go runtime, the language
  # tests on both targets and the bundle budgets
  e2e-js:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # the wasm-bindgen CLI `just docs-wasm` installs
      - uses: actions/cache@v6
        with:
          path: target/tools
          key: tools-${{ runner.os }}-wasm-bindgen-0.2.130
      # the browser the docs' Playwright tests drive
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - run: pnpm install --frozen-lockfile && pnpm -C docs exec playwright install chromium
      - run: just e2e-js
      # the site the Docs workflow deploys once this run passes
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/dist
          retention-days: 1
          if-no-files-found: error
      - run: just go-test
      - run: just language
      - run: just bundle-size >> "$GITHUB_STEP_SUMMARY"

  # the e2e suites of the compiler but the cases of tests/run
  e2e-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just e2e-tests
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ github.job }}
          path: target/nextest/ci/junit.xml

  # the cases of tests/run in shards: each runs all its passes, so the
  # comparisons between the targets and profiles of a case stay in one job
  e2e-cases:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # what the TypeScript output catches beyond the JS one is `tsc`, which
      # typechecks the TypeScript passes either way: a pull request and a push
      # to main build them without running them, and the nightly run and a
      # release, which call this workflow with another event or ref, run them
      - name: Only build the TypeScript passes for a pull request or a push to main
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: echo 'FLICK_E2E_TS_BUILD_ONLY=1' >> "$GITHUB_ENV"
      - run: just e2e-cases ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ github.job }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml

  # plugins built as WebAssembly components, run by wasmtime
  plugins:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the plugin tests build the compiler in the `e2e` profile, as the e2e jobs do
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just wasm-plugins

  postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just e2e-postgres

  # the flake: evaluate every supported platform, build the package with the
  # core test targets, and hold the dev shell to the versions the repository
  # pins (rust-toolchain.toml and package.json)
  nix:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The source of the derivation is the whole checkout, so no cache of it
      # can hit and every run builds the compiler anew. A pull request does
      # that only when it changes the flake, what the flake pins or this
      # workflow, whose steps it would otherwise never run; a push to
      # main, the nightly run and a release always do. A comparison that
      # fails counts as a change
      - name: Whether the flake's inputs changed
        id: flake
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          changed=true
          if [ -n "$BASE" ] && git fetch --depth=1 origin "$BASE" &&
            git diff --quiet FETCH_HEAD HEAD -- flake.nix flake.lock nix Cargo.lock rust-toolchain.toml .github/workflows/ci.yml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        if: steps.flake.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate every supported platform
        if: steps.flake.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build
      - name: Build the package and its tests
        if: steps.flake.outputs.changed == 'true'
        run: nix build .#flick --no-link
      # the std of this checkout, as a released compiler would fetch it by tag
      - name: Smoke-test the binary
        if: steps.flake.outputs.changed == 'true'
        run: |
          out=$(nix build .#flick --no-link --print-out-paths)
          "$out/bin/flick" --version
          FLICK_STD_PATH="$PWD/packages/std" "$out/bin/flick" --project examples/first-slice check
      - name: Dev shell versions
        if: steps.flake.outputs.changed == 'true'
        run: |
          nix develop --command bash -euo pipefail -c '
            want_rust=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)
            test "$(rustc --version | cut -d" " -f2)" = "$want_rust"
            node -e "const [major, minor] = process.versions.node.split(\".\").map(Number); if (major < 24 || (major === 24 && minor < 18)) throw new Error(\"node >= 24.18 required\")"
            want_pnpm=$(node -p "require(\"./package.json\").packageManager.split(\"@\")[1].split(\"+\")[0]")
            test "$(pnpm --version)" = "$want_pnpm"
            go version
            just --version
            cargo machete --version
          '

  # the reference model of λFlick (flick-model) against tests/run/model.txt,
  # every pass fixture and docs example, and the model properties on
  # generated programs; it needs neither Node nor Go
  model:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - run: just model

  # the Lean 4 mechanization of λFlick in formal/; elan installs the toolchain
  # pinned in formal/lean-toolchain; --wfail turns a `sorry` (a warning) into a failure
  lean:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build-args: --wfail
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

  # the go target on the other platforms it supports: the runtime's tests and
  # the portable cases of the parity harness, built and run without Node.
  # Linux x64 runs them in e2e-cases; pull requests leave the others to the
  # full set, the runs on main, the nightly run and releases
  go:
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # the expected outputs keep their LF line ends on windows
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - name: Go runtime
        run: just go-test
      # Windows is the slowest of the three: a push to main holds it to the
      # cases of tests/run/runtime, and the nightly run and a release, which
      # call this workflow with another event or ref, run every portable case
      # there. `FLICK_E2E_ONLY` is a part of the native path of a case
      - name: Only the runtime cases on Windows for a push to main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Windows' }}
        shell: bash
        run: echo 'FLICK_E2E_ONLY=runtime\' >> "$GITHUB_ENV"
      - name: Portable cases, the go executable and a non-ASCII project path
        run: just e2e-go
      # the node half and the comparison of both reports run in `just e2e`;
      # the compiler is the one the step above built for its tests
      - name: Language tests on the go target
        run: just language-go
