name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# a newer push to a pull request replaces the run of the older one
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # a pull request loosens no budget without a reason (`just ratchet`)
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          node --test tools/perf/*.test.mjs tools/load/*.test.mjs
          node tools/perf/ratchet.mjs FETCH_HEAD
      # installs the toolchain, components and targets from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-machete@0.9.2
      - run: |
          rustup target add wasm32-wasip2
          just zed
          CARGO_TARGET_DIR=target/zed cargo test --manifest-path editors/zed/Cargo.toml --locked
      - run: just lint

  # the root setup Action, as a user meets it: its installer resolves the
  # compiler release, so it is tested where every pull request sees it, not
  # only where a release is cut. It needs no Rust toolchain of its own
  actions:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: node --test .github/actions/setup-flick/install.test.mjs
      - run: node --test .github/scripts/*.test.mjs

  # `just unit` in three parts: `flick`'s tests run in the `e2e` profile
  # (optimized, with debug assertions and overflow checks, sharing the `e2e`
  # rust-cache) split into two halves; the remaining workspace crates (including
  # doc-tests and `scaling`) run in `dev` with a cache of their own
  test:
    name: test (${{ matrix.part.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part:
          - name: flick 1/2
            cache-key: e2e
            run: just unit-flick 1/2
          - name: flick 2/2
            cache-key: e2e
            run: just unit-flick 2/2
          - name: crates
            cache-key: crates
            run: just unit-crates
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.part.cache-key }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # some tests run pnpm; its version comes from `packageManager`
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
      - run: ${{ matrix.part.run }}
      - if: matrix.part.name == 'crates'
        run: just effect-coverage from-run >> "$GITHUB_STEP_SUMMARY"

  features:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - run: just feature-test

  # the JS packages, the playground's compiler, the Go runtime, the language
  # tests on both targets and the bundle budgets
  e2e-js:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # the wasm-bindgen CLI `just docs-wasm` installs
      - uses: actions/cache@v6
        with:
          path: target/tools
          key: tools-${{ runner.os }}-wasm-bindgen-0.2.130
      # the browser the docs' Playwright tests drive
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1
      - run: pnpm install --frozen-lockfile && pnpm -C docs exec playwright install chromium
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install the pinned WASM optimizer
        run: |
          binaryen=$(nix build --no-link --print-out-paths .#binaryen)
          echo "$binaryen/bin" >> "$GITHUB_PATH"
      - run: just e2e-js
      # the site the Docs workflow deploys once this run passes
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: docs/dist
          retention-days: 1
          if-no-files-found: error
      - run: just go-test
      - run: just language
      - run: just bundle-size >> "$GITHUB_STEP_SUMMARY"

  # the e2e suites of the compiler but the cases of tests/run
  e2e-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just e2e-tests
      # the primitive kernel's suite; e2e-js is near its time limit
      - run: just kernel
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ github.job }}
          path: target/nextest/ci/junit.xml

  # the cases of tests/run in shards: each runs all its passes, so the
  # comparisons between the targets and profiles of a case stay in one job
  e2e-cases:
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      # what the TypeScript output catches beyond the JS one is `tsc`, which
      # typechecks the TypeScript passes either way: a pull request and a push
      # to main build them without running them, and the nightly run and a
      # release, which call this workflow with another event or ref, run them
      - name: Only build the TypeScript passes for a pull request or a push to main
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        run: echo 'FLICK_E2E_TS_BUILD_ONLY=1' >> "$GITHUB_ENV"
      - run: just e2e-cases ${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ github.job }}-${{ matrix.shard }}
          path: target/nextest/ci/junit.xml

  # plugins built as WebAssembly components, run by wasmtime
  plugins:
    runs-on: ubuntu-26.04
    # Cold guest, host, e2e and release builds plus conformance and plugin
    # suites can exceed 35m on slower runners; match the 60m budget of `test`,
    # `e2e-js` and `model` without skipping checks.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # keep a dedicated rust-cache key: `just wasm-plugins` also builds `dev`
      # clippy, `--release` (`default_backend`) and wasm32 guest targets that
      # `shared-key: e2e` jobs never compile and therefore never save
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just wasm-plugins

  postgres:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      # the e2e jobs build the same compiler, in the `e2e` profile
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: e2e
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0,cargo-nextest@0.9.148
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: just e2e-postgres

  # the flake: evaluate every supported platform, build the package with the
  # core test targets, and hold the dev shell to the versions the repository
  # pins (rust-toolchain.toml and package.json)
  nix:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The source of the derivation is the whole checkout, so no cache of it
      # can hit and every run builds the compiler anew. A pull request does
      # that only when it changes the flake, what the flake pins or this
      # workflow, whose steps it would otherwise never run; a push to
      # main, the nightly run and a release always do. A comparison that
      # fails counts as a change
      - name: Whether the flake's inputs changed
        id: flake
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          changed=true
          if [ -n "$BASE" ] && git fetch --depth=1 origin "$BASE" &&
            git diff --quiet FETCH_HEAD HEAD -- flake.nix flake.lock nix Cargo.lock rust-toolchain.toml .github/workflows/ci.yml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        if: steps.flake.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Evaluate every supported platform
        if: steps.flake.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build
      - name: Build the package and its tests
        if: steps.flake.outputs.changed == 'true'
        run: nix build .#flick --no-link
      # the std of this checkout, as a released compiler would fetch it by tag
      - name: Smoke-test the binary
        if: steps.flake.outputs.changed == 'true'
        run: |
          out=$(nix build .#flick --no-link --print-out-paths)
          "$out/bin/flick" --version
          FLICK_STD_PATH="$PWD/packages/std" "$out/bin/flick" --project examples/first-slice check
      - name: Dev shell versions
        if: steps.flake.outputs.changed == 'true'
        run: |
          nix develop --command bash -euo pipefail -c '
            want_rust=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)
            test "$(rustc --version | cut -d" " -f2)" = "$want_rust"
            node -e "const [major, minor] = process.versions.node.split(\".\").map(Number); if (major < 24 || (major === 24 && minor < 18)) throw new Error(\"node >= 24.18 required\")"
            want_pnpm=$(node -p "require(\"./package.json\").packageManager.split(\"@\")[1].split(\"+\")[0]")
            test "$(pnpm --version)" = "$want_pnpm"
            go version
            just --version
            cargo machete --version
          '

  # the Lua profile probes on the hosts the flake pins: Lua 5.1.5, LuaJIT 2.1
  # with the JIT on and off, LÖVE 11.5 headless; then the Lua fixtures, built
  # through the committed component and run there, and the kernel's
  # conformance suite with `flick test --target lua`. A pull request runs them
  # when it changes the Lua backend, what its component links or its host
  # drives, the flake or this workflow; a push to main, the nightly run and a
  # release always do
  lua-probes:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Whether the Lua backend changed
        id: lua
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: |
          changed=true
          if [ -n "$BASE" ] && git fetch --depth=1 origin "$BASE" &&
            git diff --quiet FETCH_HEAD HEAD -- backends/lua flick-backend-support/src flick-backend flick-ir flick-pretty flick/src/backends packages/core tests/kernel flake.nix flake.lock justfile just/backends.just .github/workflows/ci.yml; then
            changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      # the kernel suite's reports on JS, which those on Lua must equal
      - uses: pnpm/action-setup@v6
        if: steps.lua.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.lua.outputs.changed == 'true'
        with:
          node-version-file: .tool-versions
      - uses: taiki-e/install-action@v2
        if: steps.lua.outputs.changed == 'true'
        with:
          tool: just@1.59.0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
        if: steps.lua.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # both Lua packages install a `lua`: name each host exactly
      - name: Install the pinned Lua hosts
        if: steps.lua.outputs.changed == 'true'
        run: |
          lua=$(nix build --no-link --print-out-paths .#lua5_1)
          luajit=$(nix build --no-link --print-out-paths .#luajit)
          love=$(nix build --no-link --print-out-paths .#love)
          {
            echo "LUA51=$lua/bin/lua"
            echo "LUAC=$lua/bin/luac"
            echo "LUAJIT=$luajit/bin/luajit"
            echo "LOVE=$love/bin/love"
          } >> "$GITHUB_ENV"
      - if: steps.lua.outputs.changed == 'true'
        run: just lua-probes
      - if: steps.lua.outputs.changed == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.lua.outputs.changed == 'true'
      - if: steps.lua.outputs.changed == 'true'
        run: just lua-run
      - if: steps.lua.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile && just kernel-lua

  # the reference model of λFlick (flick-model) against tests/run/model.txt,
  # every pass fixture and docs example, the counted Host/FFI bridge suites,
  # and the model properties on generated programs
  model:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm
      - run: |
          pnpm install --frozen-lockfile
          pnpm -C runtime build
          pnpm -C packages/effect-ts build
      - run: just model

  # the Lean 4 mechanization of λFlick in formal/; elan installs the toolchain
  # pinned in formal/lean-toolchain; --wfail turns a `sorry` (a warning) into a failure
  lean:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build-args: --wfail
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

  # the go target on the other platforms it supports: the runtime's tests and
  # the portable cases of the parity harness, built and run without Node.
  # Linux x64 runs them in e2e-cases; check the other platforms in pull
  # requests too, so a green PR covers the platform checks required on main.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # the expected outputs keep their LF line ends on windows
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Source mapping path roots
        run: |
          rustc --edition=2024 --test flick-core/src/build/paths.rs -o path-tests.exe
          ./path-tests.exe
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      - name: Go runtime
        run: just go-test
      # Windows is the slowest of the three: PRs and a push to main hold it
      # to tests/run/runtime; a nightly run and a release, which
      # call this workflow with another event or ref, run every portable case
      # there. `FLICK_E2E_ONLY` is a part of the native path of a case
      - name: Only the runtime cases on Windows for pull requests and main
        if: ${{ runner.os == 'Windows' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
        shell: bash
        run: printf '%s\n' "FLICK_E2E_ONLY=runtime\\" >> "$GITHUB_ENV"
      - name: Portable cases, the go executable and a non-ASCII project path
        run: just e2e-go
      # the node half and the comparison of both reports run in `just e2e`;
      # the compiler is the one the step above built for its tests
      - name: Language tests on the go target
        run: just language-go
