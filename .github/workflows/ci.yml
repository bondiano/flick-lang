name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # installs the toolchain, components and targets from rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime-go/go.mod
      - uses: extractions/setup-just@v2
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: |
          rustup target add wasm32-wasip2
          just zed
          CARGO_TARGET_DIR=target/zed cargo test --manifest-path editors/zed/Cargo.toml --locked
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: just check
      - run: just effect-coverage >> "$GITHUB_STEP_SUMMARY"
      - run: just e2e
      - run: just bundle-size >> "$GITHUB_STEP_SUMMARY"
      - run: just e2e-postgres

  # the reference model of λFlick (flick-model) against tests/run/model.txt,
  # and the properties of X2 on generated programs; it needs neither Node nor Go
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just model

  # the Lean 4 mechanization of λFlick in formal/; elan installs the toolchain
  # pinned in formal/lean-toolchain; --wfail turns a `sorry` (a warning) into a failure
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          build-args: --wfail
          build: true
          test: false
          lint: false
          use-mathlib-cache: false

  # the go target on each platform it supports: the runtime's tests and the
  # portable cases of the parity harness, built and run without Node
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # the expected outputs keep their LF line ends on windows
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version-file: runtime-go/go.mod
      - name: Go runtime
        working-directory: runtime-go
        run: go vet ./... && go test ./...
      - name: Portable cases, the go executable and a non-ASCII project path
        env:
          FLICK_E2E_GO_ONLY: "1"
        run: cargo test -p flick --test e2e --test go_main --test unicode_path -- --ignored run_cases exit_codes_follow_the_outcome_and_signals run_and_test_use_the_go_executable a_project_builds_runs_and_tests_under_a_non_ascii_path
      # the node half and the comparison of both reports run in `just e2e`
      - name: Language tests on the go target
        shell: bash
        working-directory: tests/language
        run: cargo run -q -p flick -- test --emit go --seed 42
