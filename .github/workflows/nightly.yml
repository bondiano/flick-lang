name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  # the full set: CI with the go target on every platform
  ci:
    uses: ./.github/workflows/ci.yml

  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just fuzz 1000000

  # the performance baseline; its numbers are the artifact perf.json
  perf:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: extractions/setup-just@v4
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: just perf
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf
          path: target/perf.json
