name: Verify RPC socket ownership

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact source commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  native-go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04-arm, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: runtime-go
    steps:
      - name: Preserve fixture line endings
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
      - name: Exact source commit
        run: git rev-parse HEAD
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - name: Native runtime checks
        run: |
          go vet ./...
          go test ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Repeated reconnect and shutdown
        run: go test ./flickrt -run '^TestRPCScopedClientReconnectsWithoutAnotherCall$' -count=50 -timeout=5m
