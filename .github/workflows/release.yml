name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          check() {
            if [ "v$2" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$1::version $2, tag $GITHUB_REF_NAME"
              exit 1
            fi
          }
          for manifest in flick/Cargo.toml editors/zed/Cargo.toml editors/zed/extension.toml; do
            check "$manifest" "$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)"
          done
          for manifest in runtime/package.json packages/effect-ts/package.json tools/astro-flick/package.json editors/vscode/package.json editors/tree-sitter-flick/tree-sitter.json; do
            check "$manifest" "$(jq -r '.version // .metadata.version' "$manifest")"
          done
          # the runtime version `flick new` pins
          check flick/src/toolchain.rs "$(grep -m1 'pub const RUNTIME' flick/src/toolchain.rs | cut -d'"' -f2)"
          check flick/src/toolchain.rs "$(grep -m1 'pub const EFFECT_TS' flick/src/toolchain.rs | cut -d'"' -f2)"
          # the `std` a compiler of this version fetches when a project names none
          std="std-v${GITHUB_REF_NAME#v}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$std" > /dev/null; then
            echo "::error::tag $std is missing: a compiler of this version fetches it as its std"
            exit 1
          fi

  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, checks]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build -p flick --release --locked --features wasm-plugins --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf flick-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release flick
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/flick.exe -DestinationPath flick-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: flick-${{ matrix.target }}.*
          if-no-files-found: error

  npm:
    needs: [build]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C runtime build
      - run: pnpm -C packages/effect-ts build
      - run: |
          pnpm -C runtime publish --no-git-checks
          pnpm -C packages/effect-ts publish --no-git-checks
          pnpm -C tools/astro-flick publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [checks, build, npm]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # install.sh and the Homebrew formula verify the archives against these
      - run: for archive in flick-*; do sha256sum "$archive" > "$archive.sha256"; done
      - run: gh release create "$GITHUB_REF_NAME" flick-* --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: [release]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: bondiano/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - name: Update Formula/flick.rb
        run: |
          version=${GITHUB_REF_NAME#v}
          base=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
          sha() { sha256sum "flick-$1.tar.gz" | cut -d' ' -f1; }
          mkdir -p tap/Formula
          cat > tap/Formula/flick.rb <<EOF
          class Flick < Formula
            desc "Compiler and toolchain for the Flick language"
            homepage "https://bondiano.github.io/flick-lang/"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/flick-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/flick-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$base/flick-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$base/flick-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "flick"
            end

            def caveats
              "Flick projects also need Node.js 24.18 or later and pnpm."
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/flick --version")
            end
          end
          EOF
      - name: Push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flick.rb
          git commit -m "flick $GITHUB_REF_NAME"
          git push
