name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: |
          check() {
            if [ "v$2" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$1::version $2, tag $GITHUB_REF_NAME"
              exit 1
            fi
          }
          for manifest in flick/Cargo.toml editors/zed/Cargo.toml editors/zed/extension.toml; do
            check "$manifest" "$(grep -m1 '^version = ' "$manifest" | cut -d'"' -f2)"
          done
          for manifest in runtime/package.json packages/effect-ts/package.json tools/astro-flick/package.json editors/vscode/package.json editors/tree-sitter-flick/tree-sitter.json; do
            check "$manifest" "$(jq -r '.version // .metadata.version' "$manifest")"
          done
          # the runtime version `flick new` pins
          check flick/src/toolchain.rs "$(grep -m1 'pub const RUNTIME' flick/src/toolchain.rs | cut -d'"' -f2)"
          # the `std` a compiler of this version fetches when a project names none
          std="std-v${GITHUB_REF_NAME#v}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$std" > /dev/null; then
            echo "::error::tag $std is missing: a compiler of this version fetches it as its std"
            exit 1
          fi

  # the timeouts of this reusable workflow's own jobs are set in ci.yml
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, checks]
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build -p flick --release --locked --features wasm-plugins --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        run: tar -czf flick-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release flick
      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/flick.exe -DestinationPath flick-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: flick-${{ matrix.target }}.*
          if-no-files-found: error

  npm:
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C runtime build
      - run: pnpm -C packages/effect-ts build
      - run: |
          pnpm -C runtime publish --no-git-checks
          pnpm -C packages/effect-ts publish --no-git-checks
          pnpm -C tools/astro-flick publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  vsix:
    needs: [version, checks]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      # the extension needs only its language client: the pinned esbuild and
      # vsce that the scripts name are fetched by npx
      - run: pnpm install --frozen-lockfile --filter ./editors/vscode
      - name: Package the extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          FLICK_EXPECTED_VERSION="$version" node editors/vscode/scripts/package.mjs \
            --out "target/vsix/flick-$version.vsix" 2>&1 | tee vsix.log
          # a warning names a file VS Code would miss
          if grep -qi warning vsix.log; then
            echo "::error::packaging warned: the VSIX may miss a file"
            exit 1
          fi
      - name: Check what the VSIX holds
        run: |
          version="${GITHUB_REF_NAME#v}"
          unzip -q "target/vsix/flick-$version.vsix" -d vsix
          # the bundle carries the language client, compiles, and is this
          # release: the script exits 1 with `::error::`, which a `! grep`
          # would not have done under `set -e`
          node editors/vscode/scripts/check-vsix.mjs vsix --version "$version"
      - name: Check that check
        run: node --test editors/vscode/scripts/check-vsix.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: target/vsix/*.vsix
          if-no-files-found: error

  release:
    needs: [checks, build, npm, vsix]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      # install.sh and the Homebrew formula verify the archives against these;
      # the VSIX, which matches the same glob, is attached with its digest
      - run: for archive in flick-*; do sha256sum "$archive" > "$archive.sha256"; done
      # `--latest`: a package release, such as `std-v0.1.0`, is a release of
      # this repository too, and `releases/latest` must name the compiler
      - run: gh release create "$GITHUB_REF_NAME" flick-* --repo "$GITHUB_REPOSITORY" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}

  homebrew:
    needs: [release]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: actions/checkout@v7
        with:
          repository: bondiano/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_KEY }}
      - name: Update Formula/flick.rb
        run: |
          version=${GITHUB_REF_NAME#v}
          base=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME
          sha() { sha256sum "flick-$1.tar.gz" | cut -d' ' -f1; }
          mkdir -p tap/Formula
          cat > tap/Formula/flick.rb <<EOF
          class Flick < Formula
            desc "Compiler and toolchain for the Flick language"
            homepage "https://bondiano.github.io/flick-lang/"
            version "$version"
            license "MIT"

            on_macos do
              on_arm do
                url "$base/flick-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "$base/flick-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$base/flick-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$base/flick-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-gnu)"
              end
            end

            def install
              bin.install "flick"
            end

            def caveats
              "Flick projects also need Node.js 24.18 or later and pnpm."
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/flick --version")
            end
          end
          EOF
      - name: Push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flick.rb
          git commit -m "flick $GITHUB_REF_NAME"
          git push

  installer-tests:
    needs: [version]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - run: node --test .github/actions/setup-flick/install.test.mjs

  # the action of this release, as a workflow of another repository uses it
  installer:
    needs: [release]
    name: Install ${{ matrix.version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, version: latest }
          - { os: ubuntu-26.04, version: pinned }
          - { os: macos-15, version: latest }
          - { os: windows-latest, version: latest }
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          version: ${{ matrix.version == 'latest' && 'latest' || github.ref_name }}
      - name: It is on PATH, and it is this release
        shell: bash
        run: |
          printed=$(flick --version)
          echo "$printed"
          if [ "$printed" != "flick ${GITHUB_REF_NAME#v}" ]; then
            echo "::error::flick --version printed $printed"
            exit 1
          fi
      # the checksum and the unpacking are checked by the installer's tests;
      # this proves a failure of the release download fails the step
      - name: A release that is not there
        id: missing
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.1
      - name: That failure was reported
        shell: bash
        run: |
          if [ "${{ steps.missing.outcome }}" != failure ]; then
            echo "::error::a missing release did not fail the step"
            exit 1
          fi
      - name: The install that worked is untouched
        shell: bash
        run: flick --version
      - name: install.sh installs it too
        if: runner.os == 'Linux' && matrix.version == 'latest'
        run: |
          FLICK_BIN_DIR="$RUNNER_TEMP/shell-bin" sh docs/public/install.sh
          "$RUNNER_TEMP/shell-bin/flick" --version
