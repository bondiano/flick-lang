name: Perf

# The performance baseline; its numbers are the artifact perf.json. Nightly
# calls it; by hand it measures any ref, to find which commit moved a number.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      ref:
        description: The ref to measure
        type: string

jobs:
  perf:
    runs-on: ubuntu-26.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime-go/go.mod
          cache-dependency-path: runtime-go/go.sum
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0
      # version comes from `packageManager` in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the log keeps what the run measured and the budget it passed
      - run: |
          set -o pipefail
          just perf 2>&1 | tee perf.log
      # the numbers a nightly is judged by, on the run itself
      - if: ${{ !cancelled() }}
        name: The numbers, and the budget a failure passed
        run: |
          {
            echo "## Performance"
            echo
            echo "Against \`tools/perf/budgets.json\`; \`perf.json\` and \`perf.log\` are artifacts."
            echo
            grep '^| ' perf.log || echo "no measurement table: the run failed before it measured"
            if grep -q '^error: ' perf.log; then
              echo
              echo "### Failed"
              echo
              echo '```'
              grep '^error: ' perf.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: perf
          path: |
            target/perf.json
            perf.log
          if-no-files-found: warn
