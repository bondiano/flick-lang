name: Docs

# CI checks and builds the site on every pull request and push (`just e2e-js`:
# translations, the site, its links and a browser; `just unit`: the examples).
# A push to main whose CI passed keeps the site CI built, and this workflow
# deploys it: nothing is published with a translation behind, a broken
# example or a dead link, and the site is built once. To redeploy, re-run
# a run of this workflow
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push supersedes a queued one
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: docs/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
      - id: deployment
        uses: actions/deploy-pages@v5
