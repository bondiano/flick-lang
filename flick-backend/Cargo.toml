[package]
name = "flick-backend"
description = "The component contract of Flick code generation backends"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ciborium = "0.2.2"
flick-ir = { path = "../flick-ir", features = ["cbor"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
unicode-normalization = "0.1.25"
wit-bindgen = "0.63.0"

[dev-dependencies]
flick-core = { path = "../flick-core" }
insta = "1.49.0"
serde_json = { workspace = true }
wit-component = "0.262.0"
wit-parser = "0.262.0"
