[package]
name = "flick-test-meta"
description = "External WASM plugin fixture testing declaration metadata, Codec/CliForm derives, and plugin-declared heads/watch"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# the plugin as a WebAssembly component
guest = ["flick-plugin/guest"]

[dependencies]
flick-plugin = { path = "../../../flick-plugin" }
