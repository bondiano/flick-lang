[package]
name = "flick-test-backend"
description = "A deliberately small backend for component-contract integration tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = []

[dependencies]
flick-backend = { path = "../../../flick-backend" }
flick-ir = { path = "../../../flick-ir", features = ["cbor"] }
serde_json = { workspace = true }
