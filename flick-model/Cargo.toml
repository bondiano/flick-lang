[package]
name = "flick-model"
description = "Reference checker and interpreter of λFlick, the core of docs/formal/core.md"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
flick-core = { path = "../flick-core", default-features = false, features = ["embedded-std"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
regex-automata = "0.4.18"
serde_json = { workspace = true }
unicode-normalization = "0.1.26"

[dev-dependencies]
flick-test-support = { path = "../flick-test-support" }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
