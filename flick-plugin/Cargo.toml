[package]
name = "flick-plugin"
description = "The interface of Flick compiler plugins: the blocks they expand and the code they give back"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# the glue of a plugin built as a WebAssembly component
guest = ["dep:wit-bindgen"]

[dependencies]
flick-plugin-macros = { path = "macros" }
serde = { version = "1.0.229", features = ["derive", "rc"] }
wit-bindgen = { version = "0.63.0", optional = true }
