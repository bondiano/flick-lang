[package]
name = "flick-plugin"
description = "The interface of Flick compiler plugins: the blocks they expand and the code they give back"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# the glue of a plugin built as a WebAssembly component
guest = ["dep:wit-bindgen", "commands"]
# the commands a plugin adds to `flick`; not in the compiler the browser runs
commands = ["dep:flick-backend"]

[dependencies]
flick-backend = { path = "../flick-backend", optional = true }
flick-plugin-macros = { path = "macros" }
fln-literals = { workspace = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
wit-bindgen = { version = "0.63.0", optional = true }
