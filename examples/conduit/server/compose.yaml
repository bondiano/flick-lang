name: flick-conduit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: conduit
      POSTGRES_PASSWORD: conduit-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduit -d conduit"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://conduit:conduit-local@postgres:5432/conduit
      JWT_SECRET: ${JWT_SECRET:-conduit-local-development-key}
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
