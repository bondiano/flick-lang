schema-version = 1

# The Conduit API on the go target, over PostgreSQL. It serves the endpoints
# of the contract and, when built, the client's files; `migrate` only brings
# the database up to date, as the server does when it starts.
[project]
kind = "app"
entries = { main = "Conduit.Server.Main", migrate = "Conduit.Server.Migrate" }
source-dir = "src"
test-dir = "test"

[dependencies]
contract = { path = "../contract" }

[build]
out-dir = "dist"
emit = "go"

# Tight thresholds: a function that grows past them is split; a query
# reads as one statement, its subqueries inline, so it may take 60 lines.
[lint]
no-let-assert = true
max-function-lines = 60
max-nesting = 3
max-complexity = 8
max-params = 4
