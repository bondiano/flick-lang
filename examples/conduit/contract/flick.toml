schema-version = 1

# The contract between the Conduit client and server: the types on the wire
# and the endpoints of the API. A source package: the client compiles it for
# js and the server for go.
[project]
kind = "lib"
source-dir = "src"
test-dir = "test"

# Tight thresholds: a function that grows past them is split.
[lint]
no-let-assert = true
max-function-lines = 40
max-nesting = 3
max-complexity = 8
max-params = 4
