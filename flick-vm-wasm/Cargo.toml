[package]
name = "flick-vm-wasm"
description = "wasm-bindgen runtime interface for executing Flick VM images on wasm32"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
flick-core = { path = "../flick-core", default-features = false }
flick-vm = { path = "../flick-vm", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"
