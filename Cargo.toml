[workspace]
resolver = "3"
members = ["flick-core", "flick", "flick-pretty", "flick-wasm"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bondiano/flick-lang"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# import items instead of naming them through a module path in code
absolute_paths = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
