[workspace]
resolver = "3"
members = ["flick-core", "flick", "flick-pretty", "flick-wasm", "flick-model", "flick-plugin", "plugins/cli", "tests/plugins/pairs"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bondiano/flick-lang"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# import items instead of naming them through a module path in code
absolute_paths = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The compiler the e2e suites build their thousands of programs with:
# optimized, yet quick to build and with the checks of a debug build.
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug-assertions = true
overflow-checks = true
incremental = true
