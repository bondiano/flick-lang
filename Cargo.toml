[workspace]
resolver = "3"
members = ["tools/component-build", "backends/js", "backends/go", "backends/lua", "flick-backend", "flick-backend-support", "flick-core", "flick-diagnostics", "flick-ffi", "flick-syntax", "flick-ir", "flick", "flick-test-support", "flick-pretty", "flick-wasm", "flick-vm", "flick-model", "flick-plugin", "flick-plugin/macros", "plugins/cli", "plugins/derive", "plugins/refined", "plugins/sql", "plugins/test", "plugins/ui", "tests/plugins/pairs", "tests/backends/literal", "examples/typed-dsl/plugin", "packages/effect-ts/tools/surface"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/bondiano/flick-lang"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# import items instead of naming them through a module path in code
absolute_paths = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
fln = { git = "https://github.com/bondiano/fln", rev = "83faab426eb0051a485c5985ef75bec13f26760a", default-features = false }
fln-literals = { git = "https://github.com/bondiano/fln", rev = "83faab426eb0051a485c5985ef75bec13f26760a" }
serde_json = "1.0.154"
wasmtime = { version = "=48.0.8", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "cache"] }

# Backtraces keep file and line; full variable info only bloats target/.
[profile.dev]
debug = "line-tables-only"

# Cranelift compiles a backend component when flick runs. Unoptimized it
# takes half a minute for an official one, which every test with a fresh
# cache would pay.
[profile.dev.package.cranelift-codegen]
opt-level = 3
[profile.dev.package.cranelift-frontend]
opt-level = 3
[profile.dev.package.regalloc2]
opt-level = 3
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The compiler the e2e suites build their thousands of programs with:
# optimized, yet quick to build and with the checks of a debug build.
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
strip = false
debug-assertions = true
overflow-checks = true
incremental = true
