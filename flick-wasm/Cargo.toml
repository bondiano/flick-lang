[package]
name = "flick-wasm"
description = "wasm-bindgen interface to the Flick core for the in-browser demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
flick-core = { path = "../flick-core", default-features = false, features = ["embedded-std", "ide"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"
