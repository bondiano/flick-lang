[package]
name = "flick-wasm"
description = "wasm-bindgen interface to the Flick core for the in-browser demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[features]
default = ["server-stdlib"]
server-stdlib = ["flick-core/server-stdlib"]

[dependencies]
flick-core = { path = "../flick-core", default-features = false, features = ["embedded-std"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
