[package]
name = "flick-wasm"
description = "wasm-bindgen interface to the Flick core for the in-browser demo"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
ciborium = "0.2.2"
flick-backend = { path = "../flick-backend" }
flick-backend-support = { path = "../flick-backend-support", default-features = false }
flick-core = { path = "../flick-core", default-features = false, features = ["embedded-std", "ide"] }
flick-ir = { path = "../flick-ir", features = ["cbor"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
wasm-bindgen = "0.2.130"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flick-backend-js = { path = "../backends/js", features = ["component"] }
