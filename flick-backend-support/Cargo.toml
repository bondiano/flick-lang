[package]
name = "flick-backend-support"
description = "Portable helpers shared by Flick backends and frontend projections"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["typed-ir"]
native-project = []
# Preserve and transform full IR 0.14.0 types during portable optimization.
# Enabled by default (including for WASM backend components); browser-only
# `flick-wasm` disables it to stay within its bundle budget.
typed-ir = []
# Opt-in whole-program polymorphic specialization + boxed-cell fallback for
# layout-aware backends; omitted from existing JS/Go/Lua components and browser
# builds until a target backend opts in.
specialize = []

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
flick-ir = { path = "../flick-ir" }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
