Null = "`option_as_null`: `null` on the wire is `None`; Flick has no null value"
Opaque = "`opaque type`: a type whose representation importers do not see"
brand = "`refined type` and `unboxed type T = T U`: nominal types without a runtime brand"
declareConstructor = "`deriving Schema` of a generic type: `Schema a -> Schema (T a)`"
encodeKeys = "`deriving Schema` of a record and the `codec` block (`field \"wire\" codec` names keys)"
extendTo = "`deriving Schema` of a record and the `codec` block (`field \"wire\" codec` names keys)"
fieldsAssign = "`deriving Schema` of a record and the `codec` block (`field \"wire\" codec` names keys)"
fromBrand = "`refined type T = U where \u2026`: a nominal type with a checked predicate and `T.parse`"
make = "`refined type T = U where \u2026`: a nominal type with a checked predicate and `T.parse`"

