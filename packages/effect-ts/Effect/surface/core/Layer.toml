[language]
buildWithScope = "`scope`: `Layer.build` builds into the owner of the region the compiler picks, never into a scope value"
catchTag = "`match` on the error in the handler of `Layer.catch`: a Flick error is told apart by its constructor, not by a tag string"
mock = "`Layer.succeed S { … }`: a test double is a whole `S.Impl` record whose unused operations fail; Flick records are exact, so a partial one does not type"

[excluded]
Any = "TS-only: a layer of any types, for TS constraints"
Error = "TS-only: a type extractor; a Flick `Layer` names its rows"
Services = "TS-only: a type extractor; a Flick `Layer` names its rows"
Success = "TS-only: a type extractor; a Flick `Layer` names its rows"
Variance = "TS-only: the variance marker of the TS type"
LayerUnify = "TS-only: TS union unification of layer types"
LayerUnifyIgnore = "TS-only: TS union unification of layer types"
PartialEffectful = "TS-only: the type of `mock`'s partial implementation"
isLayer = "TS-only: a type guard; Flick values are typed statically"
satisfiesErrorType = "TS-only: fixes a TS type parameter; a Flick signature states the rows"
satisfiesServicesType = "TS-only: fixes a TS type parameter; a Flick signature states the rows"
satisfiesSuccessType = "TS-only: fixes a TS type parameter; a Flick signature states the rows"
makeMemoMapUnsafe = "invariant: `unsafe*`; `Layer.make_memo_map` makes one in a runtime call"
forkMemoMapUnsafe = "invariant: `unsafe*`; `Layer.fork_memo_map` forks one in a runtime call"
