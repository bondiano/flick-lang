[language]
Do = "`Result.bind` chains building record literals: Flick has no do notation"
bind = "`Result.bind` chains building record literals: Flick has no do notation"
bindTo = "`Result.map` to a record literal: Flick has no do notation"
let = "`Result.map` to a record literal with the extra field: Flick has no do notation"
gen = "`from_result` in a runtime function, or `match` and `Result.bind`: Flick has no generator notation"
makeEquivalence = "the class `Eq`: the instance `Eq (Result e a)`"
fromNullishOr = "`nullable` on a foreign binding gives `Option`, then `Result.from_option`"
getOrUndefined = "`optional i` on a foreign binding: `Result.to_option`, then `None` is passed as `undefined`"
tap = "a pure callback has nothing to run; in a runtime function `match` on the result and call the step directly"

[excluded]
ResultIterator = "TS-only: the iterator of the TS generator encoding"
ResultTypeLambda = "TS-only: a type lambda for TS higher-kinded encodings"
ResultUnify = "TS-only: union unification of TS types"
ResultUnifyIgnore = "TS-only: union unification of TS types"
isResult = "TS-only: a type guard; Flick values are typed statically"
getOrNull = "TS-only: Flick has no `null`; `Result.with_default` gives a value"
getOrThrow = "invariant: throws a defect for `Err` instead of a typed failure (`from_result`)"
getOrThrowWith = "invariant: throws a defect for `Err` instead of a typed failure (`from_result`)"
try = "invariant: turns a defect (a JS throw) into a typed `Err`; defects stay defects (`catch` on a foreign binding gives typed errors)"
