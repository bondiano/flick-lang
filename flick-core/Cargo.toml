[package]
name = "flick-core"
description = "Shared Rust core for the Flick compiler and LSP"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["ide", "native-project"]
# editor queries, projections and the metadata they keep
ide = []
# projects on disk: manifests, installed packages, published artifacts,
# source maps and the docs of the built-in sources
native-project = ["dep:toml", "dep:semver", "dep:sha2", "flick-backend-js/source-maps", "flick-backend-support/native-project"]
# std in the binary, for a host with no packages: the playground
embedded-std = []

# the build script compiles src/source.rs, whose spans the IR serializes
[build-dependencies]
flick-ir = { path = "../flick-ir" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
flick-test-support = { path = "../flick-test-support" }
flick-ir = { path = "../flick-ir", features = ["json", "cbor"] }
flick-test-pairs = { path = "../tests/plugins/pairs" }
insta = "1.49.0"
toml = "1.1.8"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["time"] }

[dependencies]
annotate-snippets = "0.12.17"
flick-backend-js = { path = "../backends/js" }
flick-backend-support = { path = "../flick-backend-support" }
flick-ir = { path = "../flick-ir" }
flick-plugin = { path = "../flick-plugin" }
flick-plugin-cli = { path = "../plugins/cli" }
flick-plugin-derive = { path = "../plugins/derive" }
flick-plugin-refined = { path = "../plugins/refined" }
flick-plugin-sql = { path = "../plugins/sql" }
flick-plugin-ui = { path = "../plugins/ui" }
flick-pretty = { path = "../flick-pretty" }
semver = { version = "1.0.26", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { version = "0.10.9", optional = true }
strsim = "0.11.1"
toml = { version = "1.1.8", optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
