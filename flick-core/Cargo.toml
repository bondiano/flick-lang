[package]
name = "flick-core"
description = "Shared Rust core for the Flick compiler and LSP"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["contracts", "ide", "native-project"]
# editor queries, projections and the metadata they keep
ide = []
# projects on disk: manifests, installed packages, published artifacts,
# source maps and the docs of the built-in sources
native-project = ["dep:flick-backend-go", "dep:toml", "dep:semver", "dep:sha2", "flick-backend-js/source-maps", "flick-backend-support/native-project", "flick-ffi/native-project"]
# verification of function contracts in `PureTotalV2`, which `flick prove`
# is the only caller of; off in browser builds
contracts = []
# std in the binary, for a host with no packages: the playground
embedded-std = []
# first-party contributed commands (`std`'s `schema export`); off in browser builds
commands = ["flick-plugin/commands"]

# the build script compiles the source.rs of flick-diagnostics, whose spans
# the IR serializes
[build-dependencies]
flick-ir = { path = "../flick-ir" }
fln-literals = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
flick-test-support = { path = "../flick-test-support" }
flick-ir = { path = "../flick-ir", features = ["json", "cbor"] }
flick-test-pairs = { path = "../tests/plugins/pairs" }
insta = "1.49.0"
toml = "1.1.8"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["time"] }

[dependencies]
flick-backend-go = { path = "../backends/go", optional = true }
flick-backend-js = { path = "../backends/js" }
flick-backend-support = { path = "../flick-backend-support", default-features = false }
flick-diagnostics = { path = "../flick-diagnostics" }
flick-ffi = { path = "../flick-ffi", default-features = false }
flick-ir = { path = "../flick-ir" }
flick-plugin = { path = "../flick-plugin" }
flick-plugin-cli = { path = "../plugins/cli" }
flick-plugin-derive = { path = "../plugins/derive" }
flick-plugin-refined = { path = "../plugins/refined" }
flick-plugin-sql = { path = "../plugins/sql" }
flick-plugin-test = { path = "../plugins/test" }
flick-plugin-ui = { path = "../plugins/ui" }
flick-pretty = { path = "../flick-pretty" }
flick-syntax = { path = "../flick-syntax" }
fln-literals = { workspace = true }
semver = { version = "1.0.26", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { workspace = true }
sha2 = { version = "0.10.9", optional = true }
toml = { version = "1.1.8", optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flick-backend-support = { path = "../flick-backend-support", features = ["typed-ir"] }
