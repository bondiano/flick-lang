[package]
name = "flick-core"
description = "Shared Rust core for the Flick compiler and LSP"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = [
    "ide",
    "build-artifacts",
    "source-maps",
    "typescript",
    "diagnostic-fixes",
    "native-project",
    "terminal-diagnostics",
    "builtin-docs",
]
ide = ["typescript", "diagnostic-fixes"]
build-artifacts = []
source-maps = []
typescript = []
diagnostic-fixes = []
native-project = ["dep:toml", "dep:semver", "dep:sha2"]
terminal-diagnostics = ["dep:annotate-snippets"]
builtin-docs = []
# std in the binary, for a host with no packages: the playground
embedded-std = []

# the build script compiles src/source.rs, whose spans the IR serializes
[build-dependencies]
flick-ir = { path = "../flick-ir" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
flick-test-pairs = { path = "../tests/plugins/pairs" }
insta = "1.49.0"
toml = "1.1.8"

[dependencies]
annotate-snippets = { version = "0.12.17", optional = true }
flick-ir = { path = "../flick-ir" }
flick-plugin = { path = "../flick-plugin" }
flick-plugin-cli = { path = "../plugins/cli" }
flick-plugin-derive = { path = "../plugins/derive" }
flick-plugin-sql = { path = "../plugins/sql" }
flick-pretty = { path = "../flick-pretty" }
semver = { version = "1.0.26", optional = true }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = { version = "0.10.9", optional = true }
strsim = "0.11.1"
toml = { version = "1.1.8", optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
