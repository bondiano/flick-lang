# LuaJIT 2.1: the `luajit` dialect, Lua 5.1 with `bit`, `jit` and `ffi`.
# JIT and FFI are separate capabilities; with the JIT off the interpreter
# runs the same probes to the same results. Each fact carries `doc`, a
# pinned source, or `exec`, a probe of backends/lua/probes that ran on
# `host` on `date`.
