[package]
name = "flick-backend-js"
description = "The official Flick JavaScript emitter"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# What the component's descriptor accepts, which the backends index lists;
# a test keeps the two equal.
[package.metadata.flick]
backend-api = { minimum = "0.1.0", maximum-exclusive = "0.2.0" }
ir = { minimum = "0.17.0", maximum-exclusive = "0.18.0" }

[features]
source-maps = []
component = ["source-maps", "dep:flick-backend", "dep:ciborium", "dep:flick-diagnostics", "dep:flick-ffi", "flick-backend-support/typed-ir", "flick-ir/cbor"]
guest = ["component"]

[dependencies]
flick-backend = { path = "../../flick-backend", optional = true }
flick-diagnostics = { path = "../../flick-diagnostics", optional = true }
flick-ffi = { path = "../../flick-ffi", optional = true }
ciborium = { version = "0.2.2", optional = true }
flick-backend-support = { path = "../../flick-backend-support", default-features = false }
flick-ir = { path = "../../flick-ir" }
flick-pretty = { path = "../../flick-pretty" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { workspace = true }
