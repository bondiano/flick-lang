[package]
name = "flick-backend-go"
description = "The official Flick Go emitter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# What the component's descriptor accepts, which the backends index lists;
# a test keeps the two equal.
[package.metadata.flick]
backend-api = { minimum = "0.1.0", maximum-exclusive = "0.2.0" }
ir = { minimum = "0.15.0", maximum-exclusive = "0.16.0" }

[features]
component = ["dep:flick-backend", "dep:ciborium", "flick-ir/cbor"]
guest = ["component"]

[dependencies]
flick-backend = { path = "../../flick-backend", optional = true }
ciborium = { version = "0.2.2", optional = true }
flick-backend-support = { path = "../../flick-backend-support", features = ["native-project"] }
flick-ir = { path = "../../flick-ir" }
flick-pretty = { path = "../../flick-pretty" }
